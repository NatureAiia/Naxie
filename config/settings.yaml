environment: "development"
service_name: "naxionai-neuroworks"

router:
  complexity_threshold: 0.65
  max_context_window: 8192

memory:
  redis_url: "redis://localhost:6379/0"
  neo4j_uri: "bolt://localhost:7687"
  neo4j_user: "neo4j"
  neo4j_password: "naxion_secret_2026"
  qdrant_url: "http://localhost:6333"
  working_memory_ttl_seconds: 86400
  sliding_window_turns: 10

security:
  strict_mode: true
  allowed_tools:
    - "file_read"
    - "file_list"
    - "file_write"
    - "file_edit"
    - "code_analysis"
    - "bash_run"
    - "web_retrieval"
    - "graph_search"
    - "database_query"
    - "suggest_subagent"
    # JARVIS host skills (see src/tools/jarvis.py). Gated ones
    # (system_control, manage_clipboard, git_command) default OFF and fail
    # closed — flip in .naxion/host-tools-settings.json, not here.
    - "get_time"
    - "calculate"
    - "system_status"
    - "get_weather"
    - "notify_toast"
    - "set_reminder"
    - "list_reminders"
    - "system_control"
    - "manage_clipboard"
    - "git_command"
    - "browser_open"
    - "speak"
    - "host_settings"
