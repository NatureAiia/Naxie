[project]
name = "naxionai-neuroworks"
version = "0.1.0"
description = "Neuroworks-powered Cognitive Intelligence & Multi-Agent Swarm Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "neo4j>=5.18.0",
    "qdrant-client>=1.8.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "tenacity>=8.2.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
