name: Backend tests

on:
  push:
    paths:
      - "naxionai/backend/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "naxionai/backend/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: naxionai/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: naxionai/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest --cov=. --cov-report=term-missing
