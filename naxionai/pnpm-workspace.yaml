packages:
  - "server"
  - "web"
  - "theia/packages/*"
shamefully-hoist: true
allowBuilds:
  '@parcel/watcher': true
  # '@theia/ffmpeg' needs VS Build Tools (node-gyp) — not installed on this
  # box, so its build is skipped. Theia IDE is opt-in (dev:theia) and unused
  # by the server+web stack; re-enable if the IDE surface is ever needed.
  '@theia/ffmpeg': false
  '@whiskeysockets/baileys': true
  # cpu-features / find-git-repositories / puppeteer / ssh2 were pnpm's
  # unresolved placeholders — pinned to safe values. puppeteer (theia-only,
  # downloads Chrome) stays off like @theia/ffmpeg above.
  cpu-features: false
  drivelist: true
  esbuild: true
  find-git-repositories: false
  keytar: true
  msgpackr-extract: true
  node-pty: true
  onnxruntime-node@file:onnxruntime-node.tgz: true
  protobufjs: true
  puppeteer: false
  ssh2: false
  tesseract.js: true
overrides:
  drivelist: "file:theia/packages/app/shims/drivelist-mock"
  # onnxruntime-node tarball is fetched chunk-wise (npm CDN route is
  # unusable from here) — point every consumer (kokoro-js included) at it.
  "onnxruntime-node": "file:./onnxruntime-node.tgz"
