version: '3.8'

services:
  redis-working-memory:
    image: redis:7-alpine
    container_name: naxion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  neo4j-episodic-memory:
    image: neo4j:5.18-community
    container_name: naxion-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/naxion_secret_2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  qdrant-procedural-memory:
    image: qdrant/qdrant:v1.8.4
    container_name: naxion-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  redis_data:
  neo4j_data:
  qdrant_data:
