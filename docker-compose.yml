# ═══════════════════════════════════════════════════════════════════════════
# NeuroWorks Shell — unified stack (both systems, empty state, UAT-ready)
# ═══════════════════════════════════════════════════════════════════════════
#
# This brings up BOTH products with one command:
#
#   • neuroworks-ts   (TypeScript / Express + React)   → http://localhost:7471
#   • digital-force   (Python / FastAPI + Next.js)
#         backend  → http://localhost:8000
#         frontend → http://localhost:3000
#         qdrant   → http://localhost:6333   (vector DB)
#         postgres → localhost:5432          (df_user / df_password)
#
# It uses Docker Compose `include:` (requires Docker Compose v2.20+). Each
# system keeps its own compose file — you can also bring them up one at a time:
#
#   docker compose -f neuroworks-ts/docker-compose.yml up --build
#   docker compose -f digital-force-py/docker-compose.yml up --build
#
# ── First run ──────────────────────────────────────────────────────────────
#   1. Copy the env templates and add YOUR api keys (see AI-STARTUP.md):
#        cp neuroworks-ts/.env.example      neuroworks-ts/.env
#        cp digital-force-py/.env.example   digital-force-py/.env
#      (Digital-Force in production also REQUIRES JWT_SECRET_KEY + ENCRYPTION_KEY
#       to be set to non-placeholder values, or the backend refuses to start.)
#   2. docker compose up --build
#   3. Open the app, create the FIRST account — it becomes the workspace owner
#      (superadmin). No users ship in the shell.
#
# Ports are disjoint, so nothing collides. Data lives in named volumes.
# ═══════════════════════════════════════════════════════════════════════════

include:
  - path: neuroworks-ts/docker-compose.yml
  - path: digital-force-py/docker-compose.yml
